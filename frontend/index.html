<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
    <script>
      // Dark only (full redesign, Batch 1): always dark before first paint.
      // The old saved-theme / OS-preference logic is removed here; the
      // toggle JSX and ThemeProvider cleanup follow in the JSX batch.
      // CSS in _tokens.scss no longer reads data-theme at all, so this
      // value is only a marker — the page cannot render light either way.
      document.documentElement.dataset.theme = "dark";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
